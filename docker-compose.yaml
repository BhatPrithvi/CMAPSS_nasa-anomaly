version: '3.9'

services:
  ml-app:
    build: .
    container_name: nasa-ml
    ports:
      - "8000:8000"
    volumes:
      - ./output:/app/output  # volume mount

  prometheus:
    image: prom/prometheus
    container_name: nasa-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml  # volume mount
    ports:
      - "9090:9090"   # Prometheus dashboard

  grafana:
    image: grafana/grafana
    container_name: nasa-grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  
